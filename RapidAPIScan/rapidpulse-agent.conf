# =====================================================================================
#  RapidPulse agent settings - fill this in, then run the installer next to it:
#     Windows : double-click  install-agent-windows.bat
#     Linux   : sudo ./install-agent-linux.sh
#
#  Format: one KEY=VALUE per line. Lines starting with # are comments. No quotes needed.
#  The same file works on Windows and Linux; settings for the other OS are ignored.
#  The installer copies this file to the server (readable by administrators only), so
#  to change a setting later: edit the installed copy and restart the agent, or edit
#  this file and run the installer again.
# =====================================================================================

# ---------------------------------------------------------------- REQUIRED
# RapidPulse server address: http://<server-ip>:<port>
SERVER=http://10.0.0.5:4400

# Ingest key printed by the server installer
# (also in C:\RapidPulse\config\pulse.local.yaml on the server, under ingest_api_keys)
KEY=

# Application this server belongs to (groups it with that application's services)
APP=my-application

# ---------------------------------------------------------------- OPTIONAL: what is reported
# Role of this server, shown on its card: web | app | database | worker | ...
ROLE=app

# Name shown in RapidPulse. Empty = this computer's host name.
HOST_NAME=

# Seconds between samples (default 15)
INTERVAL=15

# Docker containers: auto = report them if Docker is installed, off = never
DOCKER=auto

# Health checks run on this server. Add one CHECK line per check:
#   CHECK=<display name>=<http(s) URL or tcp://host:port>@<service name in RapidPulse>
# Examples:
#   CHECK=Orders API health=http://localhost:8080/health@orders-api
#   CHECK=SQL Server port=tcp://localhost:1433@SQL Server
#   CHECK=Web login page=https://localhost/login@web-app

# SQL Server metrics (Windows SQL Server hosts only; needs the Microsoft ODBC Driver 17 or 18).
# The agent runs as SYSTEM: grant it access once in SSMS with
#   CREATE LOGIN [NT AUTHORITY\SYSTEM] FROM WINDOWS;  GRANT VIEW SERVER STATE TO [NT AUTHORITY\SYSTEM];
# Example:
#   MSSQL=DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost;Trusted_Connection=yes;TrustServerCertificate=yes
MSSQL=

# ---------------------------------------------------------------- OPTIONAL: how it is installed
# Install folder. Empty = default
#   Windows: C:\Program Files\RapidPulseAgent        Linux: /opt/rapidpulse-agent
INSTALL_DIR=

# Linux only: account the agent runs as. Empty or root = root (needed to read Docker
# reliably). Any other user is created if missing and added to the docker group.
RUN_AS=

# Python to use. Empty = find it automatically
# (Windows installs Python 3.11 if none is found; Linux installs python3 with the package manager).
PYTHON=

# Package download, if the server has no direct internet access:
#   PIP_INDEX_URL = internal PyPI mirror, e.g. https://nexus.example.com/repository/pypi/simple
#   PROXY         = web proxy, e.g. http://proxy.example.com:8080 (used only while installing)
PIP_INDEX_URL=
PROXY=
